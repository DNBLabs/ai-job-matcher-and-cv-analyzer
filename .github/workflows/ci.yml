# Runs on every pull request and push to main. Deploy (CD) is added in Task 29.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Ephemeral Postgres for Task 2 Alembic gate — no production secrets in CI.
    # Source: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobmatcher
          POSTGRES_PASSWORD: jobmatcher
          POSTGRES_DB: jobmatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmatcher -d jobmatcher"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://jobmatcher:jobmatcher@localhost:5432/jobmatcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Infrastructure port contract tests (Task 1)
        run: pytest tests/ports/ -v

      - name: Domain logic and repository tests (Task 2)
        run: pytest tests/domain/ -v

      - name: Auth session tests (Task 3)
        run: pytest tests/auth/test_sessions.py tests/auth/test_security_boundaries.py -v

      - name: Google OAuth sign-in tests (Task 4)
        # Mocked Google token/userinfo endpoints; no GOOGLE_OAUTH_* secrets required in CI.
        # Source: https://docs.github.com/en/actions/security-for-github-actions/security-guides/about-secrets
        run: pytest tests/auth/test_google_oauth.py -v

      - name: Magic link sign-in tests (Task 5)
        run: pytest tests/auth/test_magic_link.py -v

      - name: Sign-out, ingress rate limits, and IDOR routing tests (Task 6)
        run: pytest tests/auth/test_logout.py tests/auth/test_ingress_rate_limit.py tests/auth/test_idor_routing.py -v

      - name: CV upload and PDF validation tests (Task 7)
        run: pytest tests/validation/test_pdf.py tests/cvs/ -v

      - name: Apply database migrations (Task 2)
        # Source: https://alembic.sqlalchemy.org/en/latest/tutorial.html#running-our-first-migration
        run: alembic upgrade head

      - name: Auth session Postgres smoke (Task 3)
        # Validates sessions table on ephemeral Postgres after Alembic.
        # Source: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
        run: pytest tests/auth/test_sessions_postgres.py -v

      - name: Full backend test suite
        run: pytest -v

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Build API and worker images
        run: docker compose build
