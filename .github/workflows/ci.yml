# Runs on every pull request and push to main. Deploy (CD) is added in Task 29.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Ephemeral Postgres for Task 2 Alembic gate — no production secrets in CI.
    # Source: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobmatcher
          POSTGRES_PASSWORD: jobmatcher
          POSTGRES_DB: jobmatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmatcher -d jobmatcher"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://jobmatcher:jobmatcher@localhost:5432/jobmatcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply database migrations
        # Source: https://alembic.sqlalchemy.org/en/latest/tutorial.html#running-our-first-migration
        run: alembic upgrade head

      - name: Run full test suite
        run: pytest -v

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose file
        run: docker compose config --quiet

      - name: Build API and worker images
        run: docker buildx bake -f docker-compose.yml --set "*.cache-from=type=gha" --set "*.cache-to=type=gha,mode=max" --load

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    # Credential-free checks only — no Azure secrets in CI (Task 25/26).
    # `terraform plan` needs ARM creds and is run locally by the operator on apply.
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, app, grants]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: infra/${{ matrix.stack }}/.terraform
          key: terraform-${{ matrix.stack }}-${{ hashFiles(format('infra/{0}/.terraform.lock.hcl', matrix.stack)) }}
          restore-keys: |
            terraform-${{ matrix.stack }}-

      - name: Set up Terraform
        # Source: https://github.com/hashicorp/setup-terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        # -backend=false skips remote state; the app stack uses a partial
        # azurerm backend whose storage account name is supplied only on apply.
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  cve-scan:
    name: Container CVE scan
    runs-on: ubuntu-latest
    # Supply-chain gate (CONTEXT.md §Supply chain & CI/CD): fail on Critical
    # container CVEs that have a published fix. API and worker share one backend
    # image, so scanning it once covers both Container Apps.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ai-job-matcher-backend:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for Critical CVEs with a published fix
        # PINNED v0.36.0 — latest release.
        # Source: https://github.com/aquasecurity/trivy-action/releases
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-job-matcher-backend:${{ github.sha }}
          severity: CRITICAL
          # Only fail on CVEs that have a fix available (CONTEXT.md requirement).
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          format: table
